# Bundle layer contributed by dsh-a2a-messenger.
# Users override `config` in their profile's own cordis.patch.yml.
- insert:
    - id: a2a-messenger
      name: 'dsh-a2a-messenger'
      config:
        serverUrl: ''
        token: ''
        agentName: ''
        deviceName: ''
        transport: 'github'
        mailboxEncryption: 'readable'
        mailboxRoute: ''
        mailboxTtlHours: 168
        filesystemDir: ''
        directIcePolicy: 'stun'
        stunServers:
          - 'stun:stun.l.google.com:19302'
          - 'stun:stun1.l.google.com:19302'
        turnServers: []
        trustedPeers: []
